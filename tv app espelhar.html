<html lang="pt-BR">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>JC TV STREAMING</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<style>

body {
  background: #fff;
  color: #000;
  padding: 1rem;
}

/* Centraliza os cards da aba de séries */
#seriesTabs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  padding: 1rem 0;
  margin-top: 100px; /* espaço para a barra fixa */
}

#seriesTabs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  padding: 1rem 0;
  margin-top: 100px;
}

.series-tab {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background-color: #eee;
  border-radius: 0.5rem;
  max-width: 100%;
  white-space: normal;
  cursor: pointer;
}

.series-tab img {
  width: 100%;
  height: 100%;
  border-radius: 5px;
  flex-shrink: 0;
}

.series-tab .card {
  width: 100px;
}

.card-body p.card-text {
  white-space: normal !important;
  word-break: break-word;
  overflow-wrap: break-word;
  font-size: 0.75rem;
  text-align: center;
  max-height: 6em;
  line-height: 1.2;
}

#serieInfo {
  display: none;
  padding: 1rem;
  background: rgba(255, 255, 255, 0.25); /* fundo transparente */
  border-radius: 12px;
  margin: 1rem auto;
  max-width: 1200px;
  backdrop-filter: blur(10px); /* deixa borrado */
  -webkit-backdrop-filter: blur(10px);
  color: #000; /* texto preto forte */
}

.serie-details {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
}

.serie-details img {
  width: 100px;
  height: auto;
  border-radius: 5px;
}

.serie-details div {
  flex: 1;
}

#serieInfo h4,
#serieInfo p {
  color: #000; /* garante que todos os textos fiquem bem pretos */
  font-weight: 600; /* um pouco mais forte que normal */
}

.ep-thumb {
  width: 80px;
  height: 45px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
}

#backButton {
  display: none;
  position: fixed;
  top: 2px; /* afasta um pouco do topo */
  right: 0px; /* afasta um pouco da esquerda */
  z-index: 1055;
  background-color: #FFC107;
  color: #000000;
  border: none;
  padding: 8px 10px; /* menor que antes */
  border-radius: 10px; /* menor arredondamento */
  cursor: pointer;
  font-weight: bold; /* Texto em negrito */
  font-size: 12px; /* fonte menor */
  transition: 0.3s ease;
}

#backButton:hover {
  background-color: #007BFF;
  color: #fff; /* melhora contraste no hover */
}

/* Footer */
footer.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: black;
  color: #fff; /* cor diferente */
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  font-size: 1rem; /* maior */
  z-index: 1000;
}

footer.footer img {
  height: 30px;
  width: auto;
}

#centralSearch {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  z-index: 1050;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#serieSynopsis .synopsis-text {
  display: block;
  overflow: hidden;
}
#espelharButton {
  display: none !important;
}
.btn-success {
  background-color: #FFC107;
  color: #000000;
  font-size: 1rem;
  padding: 0.25rem 1rem;
  border-radius: 10px;
  font-weight: bold;
  margin-left: 0; /* 👈 remove o bug */
}

.btn-success:hover {
  background: #007BFF;
}

.active-episode {
  background: #ffc107 !important;
  color: #000 !important;
  font-weight: bold;
  border-radius: 8px;
  transition: 0.3s;
}

.modal-header {
  background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
  border: none;
  position: absolute;
  width: 100%;
  z-index: 10;
}

#modalTitleText {
  font-size: clamp(10px, 2vw, 14px);
}

/* MINI BOTÕES */
.episode-grid{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.episode-mini-btn{
  width:35px;              /* menor */
  height:35px;             /* menor */
  border:none;
  border-radius:8px;

background: rgba(20,20,20,0.75);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
color: #fff;
border: 1px solid rgba(255,255,255,0.10);
box-shadow: 0 4px 20px rgba(0,0,0,0.35);

  font-size:13px;          /* texto menor */
  font-weight:bold;

  transition:.2s;
  cursor:pointer;

  box-shadow:0 2px 5px rgba(0,0,0,.20);
}

.episode-mini-btn:hover{
  background:#FFC107;      /* hover */
  color:#000;
  transform:scale(1.08);
}

.episode-mini-btn.active-episode{
  background:#FFC107 !important;
  color:#000 !important;
  border:2px solid #000;
}
/* Informações do Modal sempre visível */
.modal-header {
  opacity: 1 !important;
  transition: none !important;
}
/* logotipo maior */
.logo-fixed {
  width: 40px;        /* tamanho padrão que você quer */
  height: 40px;       /* força proporção fixa */
  object-fit: contain; /* mantém a imagem inteira sem distorcer */
}
</style>

<body>
<button id="backButton" class="btn btn-primary btn-lg">Voltar</button>

<div id="centralSearch">

    <p></p>
  </div>
</div>

<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content text-white" style="background:transparent;">
      <div class="modal-header border-0 modal-header-transparent">
        <h5 id="modalTitle" class="modal-title d-flex align-items-center gap-2">
    <img id="modalLogo" src="" class="logo-fixed">
    <span id="modalTitleText"></span>
</h5>
        <div>
          <button id="prevEpisodeBtn" class="btn btn-sm me-2">⏮️ </button>
          <button id="nextEpisodeBtn" class="btn btn-sm me-2">⏭️ </button>
          <button id="castButton" class="btn btn-sm me-2">📺 </button>
          <button type="button" class="btn btn-sm btn-danger me-2" data-bs-dismiss="modal"> X </button>
        </div>
      </div>

      <div class="modal-body p-0">
  <iframe id="iframePlayer"
    width="100%"
    height="100%"
    style="border:none;"
    allow="autoplay; fullscreen">
  </iframe>
</div>
    </div>
  </div>
</div>

</footer>

// ---------------- Categorias
function populateCategories(){
  const allCategories = new Set();
  Object.values(seriesData).forEach(s => s.categories.forEach(c => allCategories.add(c)));
  [...allCategories].sort().forEach(cat=>{
    const option = document.createElement("option");
    option.value = cat; option.textContent = cat;
    categoryFilter.appendChild(option);
  });
}

// ---------------- Monta abas (ordenando por date)
function buildTabs(filteredKeys = null) {
  seriesTabs.innerHTML = "";
  let keys = filteredKeys || Object.keys(seriesData);

  // Ordena por data (mais recente primeiro)
  keys.sort((a, b) => {
    const dateA = seriesData[a].date
      ? new Date(seriesData[a].date.split("/").reverse().join("-"))
      : new Date(0);
    const dateB = seriesData[b].date
      ? new Date(seriesData[b].date.split("/").reverse().join("-"))
      : new Date(0);
    return dateB - dateA;
  });

  keys.forEach(key => {
    const s = seriesData[key];
    const li = document.createElement("li");
    li.className = "nav-item";

    const btn = document.createElement("button");
    btn.className = "nav-link p-0 border-0 bg-transparent text-center series-tab";
    btn.dataset.target = key;

    // 🔴 TV AO VIVO
  if (s.categories && s.categories.some(c => c.toLowerCase() === "tv ao vivo")) {

    btn.innerHTML = `
      <div class="card border-0 text-center" style="width: 110px;">
        <img src="${s.poster}" 
          style="height:60px; object-fit:contain; background:#fff; padding:5px;" 
          class="rounded">

        <div class="card-body p-1">
          <p class="card-text small mb-0">${s.name}</p>
          <small style="font-size:10px; color:#6c757d;">
            <span style="color:#dc3545;">●</span> Ao Vivo
          </small>
        </div>
      </div>
    `;

  } else {

    btn.innerHTML = `
      <div class="card border-0" style="width: 80px;">
        <img src="${s.poster}" class="card-img-top rounded"
          style="height:120px;object-fit:cover;" alt="${s.name}">
        
        <div class="card-body p-1">
          <p class="card-text small text-truncate mb-0">${s.name}</p>
        </div>
      </div>
    `;
  }

  li.appendChild(btn);
  seriesTabs.appendChild(li);
});

// ---------------- Filtros de busca + categoria
function applyFilters() {
  const q = (seriesSearch.value || "").toLowerCase().trim();
  const cat = categoryFilter.value;

  const keys = Object.keys(seriesData).filter(key => {
    const s = seriesData[key];

    // 🔍 busca em nome
    const matchName = s.name.toLowerCase().includes(q);

    // 🔍 busca em categorias
    const matchCategory = (s.categories || [])
      .some(c => c.toLowerCase().includes(q));

    // 🔍 busca em gênero
    const matchGenero = (s.genero || [])
      .some(g => g.toLowerCase().includes(q));

    // 🔍 busca em linguagem
    const matchLanguage = (s.language || [])
      .some(l => l.toLowerCase().includes(q));

    // 🔍 busca em episódios (SUBCATEGORIA 🔥)
    const matchEpisodes = Object.values(s.seasons || {})
      .flat()
      .some(ep => ep.title && ep.title.toLowerCase().includes(q));

    // 🔍 resultado final
    const matchSearch = !q || (
      matchName ||
      matchCategory ||
      matchGenero ||
      matchLanguage ||
      matchEpisodes
    );

    // 🎯 filtro de categoria selecionada
    const matchCatFilter = !cat || (s.categories || [])
      .some(c => c.toLowerCase() === cat.toLowerCase());

    return matchSearch && matchCatFilter;
  });

  buildTabs(keys);
}

function playEpisode(index){
  if(index < 0 || index >= episodeQueue.length) return;

  currentEpisodeIndex = index;
  const videoData = episodeQueue[currentEpisodeIndex];

  // ---------------- TÍTULO DO MODAL ----------------
  document.getElementById("modalTitleText").textContent = videoData.title;

  // ---------------- LOGOTIPO NO MODAL ----------------
  const modalLogo = document.getElementById("modalLogo");

  if (videoData.logo) {
    modalLogo.src = videoData.logo;
    modalLogo.style.display = "block";
  } else {
    modalLogo.style.display = "none";
  }

  // ---------------- PLAYER ----------------
  if (currentHls) {
    currentHls.destroy();
    currentHls = null;
  }

  new bootstrap.Modal(document.getElementById("playerModal")).show();
}

playEpisode = function(index){

  if(index < 0 || index >= episodeQueue.length) return;

  currentEpisodeIndex = index;
  const videoData = episodeQueue[currentEpisodeIndex];

  // ---------------- TÍTULO ----------------
  document.getElementById("modalTitleText").textContent = videoData.title;

    modalLogo.style.display = "none";
  }

  // ---------------- IFRAME PLAYER ----------------
  const iframe = document.getElementById("iframePlayer");

  iframe.src = videoData.src;

  new bootstrap.Modal(document.getElementById("playerModal")).show();
};
